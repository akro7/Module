name: Build AKRO GameEquipment - Redmi 14C

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: 'v1.0'

jobs:
  build:
    name: Download ROM - Extract - Build Module - Upload GoFile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip curl wget aria2 p7zip-full python3

      - name: Download ROM
        run: |
          mkdir -p rom_work
          ROM_URL="https://xm01."
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0"

          aria2c -x16 -s16 -k1M --user-agent="$UA" --dir=rom_work --out=rom_full.zip "$ROM_URL" \
          || wget -q --user-agent="$UA" -O rom_work/rom_full.zip "$ROM_URL" \
          || curl -L -A "$UA" -o rom_work/rom_full.zip "$ROM_URL"

          ls -lh rom_work/rom_full.zip
          file rom_work/rom_full.zip

      - name: Extract vendor/{bin,etc,lib,lib64} FULL
        run: |
          mkdir -p extracted/{vendor_bin,vendor_etc,vendor_lib,vendor_lib64}

          python3 << 'PYEXT'
          import zipfile, os, fnmatch, shutil

          ROM  = "rom_work/rom_full.zip"
          BASE = "extracted"

          TARGETS = {
            "vendor_bin":   ["*vendor/bin/*"],
            "vendor_etc":   ["*vendor/etc/*"],
            "vendor_lib":   ["*vendor/lib/egl/*","*vendor/lib/hw/*","*vendor/lib/*.so"],
            "vendor_lib64": ["*vendor/lib64/egl/*","*vendor/lib64/hw/*","*vendor/lib64/*.so"],
          }

          def detect_prefix(z):
            for n in z.namelist():
              if "vendor/bin/" in n:
                return n[:n.index("vendor/bin/")]
            return ""

          with zipfile.ZipFile(ROM) as z:
            prefix = detect_prefix(z)
            print(f"[*] prefix: '{prefix}'")
            total = 0
            for entry in z.namelist():
              if entry.endswith("/"): continue
              for folder, pats in TARGETS.items():
                if folder == "vendor_lib" and "lib64" in entry: continue
                full_pats = pats + [prefix + p.lstrip("*") for p in pats]
                if any(fnmatch.fnmatch(entry, p) for p in full_pats):
                  rel = entry.replace(prefix,"",1) if prefix else entry
                  out = os.path.join(BASE, folder, rel)
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  with z.open(entry) as src, open(out,"wb") as dst:
                    shutil.copyfileobj(src, dst)
                  print(f"  [{folder}] {rel}")
                  total += 1
                  break
            print(f"\n[✓] {total} files extracted")
          PYEXT

          echo "bin   : $(find extracted/vendor_bin  -type f | wc -l)"
          echo "etc   : $(find extracted/vendor_etc  -type f | wc -l)"
          echo "lib   : $(find extracted/vendor_lib  -type f | wc -l)"
          echo "lib64 : $(find extracted/vendor_lib64 -type f | wc -l)"
          echo "total : $(find extracted -type f | wc -l)"

      - name: Build Magisk Module from scratch
        run: |
          M="module_build"
          mkdir -p "$M"/{META-INF/com/google/android,system/vendor/{bin,etc,lib/{egl,hw},lib64/{egl,hw}}}

          # module.prop
          cat > "$M/module.prop" << PROP
id=AKRO_GameEquipment_14C
name=AKRO Complete Game Equipment - Redmi 14C
version=${{ github.event.inputs.version }}
versionCode=$(echo "${{ github.event.inputs.version }}" | tr -d 'v.')
author=AKRO
description=GPU/Thermal/Touch optimization Redmi 14C 4G Snapdragon 4 Gen 2 Adreno 619
PROP

          # META-INF
          echo "#MAGISK" > "$M/META-INF/com/google/android/updater-script"
          cat > "$M/META-INF/com/google/android/update-binary" << 'UB'
#!/sbin/sh
OUTFD=$2; ZIPFILE=$3
umask 022
ui_print() { echo "$1"; }
mount /data 2>/dev/null
if [ -f /data/adb/magisk/util_functions.sh ]; then
  . /data/adb/magisk/util_functions.sh; NVBASE=/data/adb
elif [ -f /data/adb/ksu/util_functions.sh ]; then
  . /data/adb/ksu/util_functions.sh; NVBASE=/data/adb
else
  ui_print "Install Magisk or KernelSU!"; exit 1
fi
setup_flashable; mount_partitions; api_level_arch_detect
$BOOTMODE && boot_actions
SKIPUNZIP=1
. $TMPDIR/install.sh
print_modname; on_install
[ "$(grep_prop PROPFILE $TMPDIR/module.prop)" = "true" ] && cp -af $TMPDIR/system.prop $MODPATH/system.prop
[ "$(grep_prop LATESTARTSERVICE $TMPDIR/module.prop)" = "true" ] && cp -af $TMPDIR/service.sh $MODPATH/service.sh
set_permissions
UB

          # install.sh
          cat > "$M/install.sh" << 'IS'
SKIPMOUNT=false
PROPFILE=true
POSTFSDATA=false
LATESTARTSERVICE=true
REPLACE=""
print_modname() {
  ui_print " "
  ui_print "╔══════════════════════════════════════╗"
  ui_print "║  AKRO GameEquipment  -  Redmi 14C   ║"
  ui_print "║  Snapdragon 4 Gen 2  |  Adreno 619  ║"
  ui_print "╚══════════════════════════════════════╝"
  ui_print " "
  sleep 1
  ui_print "• Device  : $(getprop ro.build.product)"
  ui_print "• Model   : $(getprop ro.product.model)"
  ui_print "• Android : $(getprop ro.build.version.release)"
}
on_install() {
  ui_print "[*] Installing vendor files..."
  unzip -o "$ZIPFILE" 'system/*' -d "$MODPATH" >&2
  ui_print "[*] Clearing shader cache..."
  for i in $(find /data/user_de -name "*shaders_cache*" 2>/dev/null | grep code_cache); do rm -rf "$i" 2>/dev/null; done
  for i in $(find /data -type f -name "*shader*" 2>/dev/null); do rm -f "$i" 2>/dev/null; done
  ui_print "[✓] Done"
}
set_permissions() {
  set_perm_recursive "$MODPATH" 0 0 0755 0644
  set_perm_recursive "$MODPATH/system/vendor/bin" 0 2000 0755 0755
  ui_print "╔══════════════════════════════════════╗"
  ui_print "║   Complete! Reboot to apply         ║"
  ui_print "╚══════════════════════════════════════╝"
}
IS

          # system.prop
          cat > "$M/system.prop" << 'SP'
ro.vendor.dfps.enable=false
ro.vendor.smart_dfps.enable=false
debug.gr.swapinterval=0
ro.surface_flinger.max_frame_buffer_acquired_buffers=3
debug.egl.buffcount=4
debug.sf.recomputecrop=0
debug.sf.disable_backpressure=1
persist.vendor.thermal.enable=false
persist.vendor.thermal.config=thermal-normal
sys.thermal.data.source=0
touch.size.scale=1
touch.size.bias=0
touch.pressure.scale=0.001
touch.distance.calibration=none
touch.coverage.calibration=box
touch.gestureMode=spots
MultitouchSettleInterval=1ms
MultitouchMinDistance=1px
TapInterval=1ms
TapSlop=1px
net.ipv4.tcp_fastopen=3
wifi.supplicant_scan_interval=180
ro.config.low_ram=false
ro.lmk.critical_upgrade=true
ro.lmk.upgrade_pressure=40
ro.lmk.downgrade_pressure=60
ro.lmk.kill_heaviest_task=true
ro.vendor.qti.sys.fw.bg_apps_limit=60
ro.gfx.driver.1=com.qualcomm.qti.gpudrivers.sm6225.api30
debug.hwui.renderer=opengl
persist.graphics.vulkan.disable=false
persist.miui.extm.enable=1
debug.sf.enable_hwc_vds=1
SP

          # service.sh
          cat > "$M/service.sh" << 'SS'
#!/system/bin/sh
MODDIR=${0%/*}
until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
sleep 5
for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
  echo "performance" > "$cpu" 2>/dev/null || echo "schedutil" > "$cpu" 2>/dev/null
done
echo "performance" > /sys/class/kgsl/kgsl-3d0/devfreq/governor 2>/dev/null
echo 0 > /sys/class/kgsl/kgsl-3d0/bus_split 2>/dev/null
echo 1 > /sys/class/kgsl/kgsl-3d0/force_clk_on 2>/dev/null
echo 10000 > /sys/class/kgsl/kgsl-3d0/idle_timer 2>/dev/null
for b in /sys/block/*/queue/scheduler; do echo "deadline" > "$b" 2>/dev/null; done
for b in /sys/block/*/queue/read_ahead_kb; do echo "2048" > "$b" 2>/dev/null; done
echo 10 > /proc/sys/vm/swappiness
echo 0 > /proc/sys/vm/page-cluster
echo 3 > /proc/sys/net/ipv4/tcp_fastopen 2>/dev/null
echo 1 > /proc/sys/net/ipv4/tcp_low_latency 2>/dev/null
SS
          chmod +x "$M/service.sh"

          # Inject the 4 folders
          find extracted/vendor_bin -type f 2>/dev/null | while read f; do
            cp -v "$f" "$M/system/vendor/bin/$(basename $f)"
          done
          find extracted/vendor_etc -type f 2>/dev/null | while read f; do
            rel=$(echo "$f" | sed 's|.*vendor/etc/||')
            mkdir -p "$M/system/vendor/etc/$(dirname $rel)"
            cp -v "$f" "$M/system/vendor/etc/$rel"
          done
          find extracted/vendor_lib -type f 2>/dev/null | while read f; do
            if echo "$f"|grep -q "egl/"; then cp -v "$f" "$M/system/vendor/lib/egl/$(basename $f)"
            elif echo "$f"|grep -q "hw/"; then cp -v "$f" "$M/system/vendor/lib/hw/$(basename $f)"
            else cp -v "$f" "$M/system/vendor/lib/$(basename $f)"; fi
          done
          find extracted/vendor_lib64 -type f 2>/dev/null | while read f; do
            if echo "$f"|grep -q "egl/"; then cp -v "$f" "$M/system/vendor/lib64/egl/$(basename $f)"
            elif echo "$f"|grep -q "hw/"; then cp -v "$f" "$M/system/vendor/lib64/hw/$(basename $f)"
            else cp -v "$f" "$M/system/vendor/lib64/$(basename $f)"; fi
          done

          echo "Total module files: $(find $M -type f | wc -l)"

      - name: Package ZIP
        run: |
          ZIP="AKRO_GameEquipment_Redmi14C_${{ github.event.inputs.version }}.zip"
          cd module_build && zip -r9 "../$ZIP" . --exclude "*.DS_Store" && cd ..
          ls -lh "$ZIP"
          echo "SHA256: $(sha256sum $ZIP | cut -d' ' -f1)"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload to GoFile
        run: |
          ZIP=$(ls AKRO_GameEquipment_Redmi14C_*.zip | head -1)
          SERVER=$(curl -s "https://api.gofile.io/servers" | python3 -c "
import json,sys
d=json.load(sys.stdin)
s=d.get('data',{}).get('servers',[])
print(s[0]['name'] if s else 'store1')
")
          RESP=$(curl -s -F "file=@$ZIP" "https://$SERVER.gofile.io/uploadFile")
          URL=$(echo "$RESP" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print(d['data']['downloadPage'] if d.get('status')=='ok' else 'FAILED')
")
          [ "$URL" = "FAILED" ] && echo "Upload failed!" && exit 1
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✅  UPLOAD DONE                         ║"
          echo "║  $URL"
          echo "╚══════════════════════════════════════════╝"
          cat >> $GITHUB_STEP_SUMMARY << SUM
## ✅ AKRO GameEquipment - Redmi 14C
| | |
|--|--|
| Version | ${{ github.event.inputs.version }} |
| GoFile | $URL |
SUM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKRO-Redmi14C-${{ github.event.inputs.version }}
          path: "*.zip"
          retention-days: 30
