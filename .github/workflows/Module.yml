# ============================================================
# build_redmi14c_module.yml  —  AKRO GameEquipment Redmi 14C
# ============================================================
name: Build AKRO GameEquipment - Redmi 14C

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version (e.g. v1.0)'
        required: true
        default: 'v1.0'
        type: string

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1  —  Download ROM + extract the 4 vendor folders
  # ─────────────────────────────────────────────────────────
  extract-rom-folders:
    name: Extract vendor/{bin,etc,lib,lib64} from ROM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip curl wget aria2 p7zip-full python3

      - name: Download full ROM zip
        run: |
          mkdir -p rom_work
          ROM_URL="https://xm01."

          echo "[*] Trying aria2c..."
          aria2c -x 16 -s 16 -k 1M \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" \
            --dir=rom_work --out=rom_full.zip "$ROM_URL" \
          || {
            echo "[*] aria2c failed, trying wget..."
            wget -q \
              --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" \
              -O rom_work/rom_full.zip "$ROM_URL"
          } || {
            echo "[*] wget failed, trying curl..."
            curl -L \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" \
              -o rom_work/rom_full.zip "$ROM_URL"
          }

          ls -lh rom_work/rom_full.zip
          file rom_work/rom_full.zip

      - name: Scan ROM manifest + find target paths
        run: |
          echo "[*] Listing ROM contents..."
          unzip -l rom_work/rom_full.zip > rom_work/manifest.txt 2>&1 \
          || 7z l rom_work/rom_full.zip > rom_work/manifest.txt 2>&1

          echo "--- vendor/bin ---"
          grep -i "vendor/bin/" rom_work/manifest.txt | head -30 || true
          echo "--- vendor/etc ---"
          grep -i "vendor/etc/" rom_work/manifest.txt | head -30 || true
          echo "--- vendor/lib ---"
          grep -iE "vendor/lib[^6]" rom_work/manifest.txt | head -30 || true
          echo "--- vendor/lib64 ---"
          grep -i "vendor/lib64" rom_work/manifest.txt | head -30 || true

      - name: Extract all 4 folders (bin / etc / lib / lib64)
        run: |
          mkdir -p extracted/{vendor_bin,vendor_etc,vendor_lib,vendor_lib64}

          python3 << 'PYEXTRACT'
          import zipfile, os, fnmatch, shutil

          ROM   = "rom_work/rom_full.zip"
          BASE  = "extracted"

          # Map: output subfolder  ->  patterns to match inside ZIP
          TARGETS = {
              "vendor_bin":  [
                  "*vendor/bin/*",
              ],
              "vendor_etc":  [
                  "*vendor/etc/*",
              ],
              "vendor_lib":  [
                  "*vendor/lib/egl/*",
                  "*vendor/lib/hw/*",
                  "*vendor/lib/*.so",
              ],
              "vendor_lib64": [
                  "*vendor/lib64/egl/*",
                  "*vendor/lib64/hw/*",
                  "*vendor/lib64/*.so",
              ],
          }

          def matches(name, patterns):
              return any(fnmatch.fnmatch(name, p) for p in patterns)

          # Detect path prefix inside ZIP (some ROMs nest under system/ or vendor/)
          def detect_prefix(z):
              names = z.namelist()
              for n in names:
                  if "vendor/bin/" in n:
                      idx = n.index("vendor/bin/")
                      return n[:idx]   # e.g. "" or "system/"
              return ""

          with zipfile.ZipFile(ROM) as z:
              prefix = detect_prefix(z)
              print(f"[*] Detected vendor prefix: '{prefix}'")

              # Re-map patterns with detected prefix
              MAPPED = {}
              for folder, pats in TARGETS.items():
                  MAPPED[folder] = [prefix + p.lstrip("*") if not p.startswith("*"+prefix) else p
                                    for p in pats]
                  # Always keep wildcard form too
                  MAPPED[folder] += pats

              total = 0
              for entry in z.namelist():
                  if entry.endswith("/"):
                      continue
                  for folder, pats in MAPPED.items():
                      # Skip lib64 entries in lib folder
                      if folder == "vendor_lib" and "lib64" in entry:
                          continue
                      if matches(entry, pats):
                          # Strip prefix to get clean relative path
                          rel = entry.replace(prefix, "", 1) if prefix else entry
                          out_path = os.path.join(BASE, folder, rel)
                          os.makedirs(os.path.dirname(out_path), exist_ok=True)
                          with z.open(entry) as src, open(out_path, "wb") as dst:
                              shutil.copyfileobj(src, dst)
                          print(f"  [{folder}] {rel}")
                          total += 1
                          break

              print(f"\n[✓] Extracted {total} files total")
          PYEXTRACT

          echo ""
          echo "=== Extraction summary ==="
          echo "vendor/bin   : $(find extracted/vendor_bin  -type f | wc -l) files"
          echo "vendor/etc   : $(find extracted/vendor_etc  -type f | wc -l) files"
          echo "vendor/lib   : $(find extracted/vendor_lib  -type f | wc -l) files"
          echo "vendor/lib64 : $(find extracted/vendor_lib64 -type f | wc -l) files"
          echo "Total        : $(find extracted -type f | wc -l) files"

      - name: Upload extracted folders
        uses: actions/upload-artifact@v4
        with:
          name: vendor-folders-extracted
          path: extracted/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # JOB 2  —  Wait for user to send the 4 folders,
  #           then build the module from scratch
  # ─────────────────────────────────────────────────────────
  build-module:
    name: Build Magisk/KSU Module from scratch
    runs-on: ubuntu-latest
    needs: extract-rom-folders

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extracted vendor folders
        uses: actions/download-artifact@v4
        with:
          name: vendor-folders-extracted
          path: extracted/

      - name: Build module directory from scratch
        run: |
          M="module_build"
          mkdir -p "$M"/{META-INF/com/google/android,common,system/vendor/{bin,etc,lib/{egl,hw},lib64/{egl,hw}}}

          # ── module.prop ─────────────────────────────────
          cat > "$M/module.prop" << PROP
id=AKRO_GameEquipment_14C
name=AKRO Complete Game Equipment - Redmi 14C
version=${{ github.event.inputs.version || 'v1.0' }}
versionCode=$(echo "${{ github.event.inputs.version || 'v1.0' }}" | tr -d 'v.')
author=AKRO
description=GPU/Thermal/Touch optimization for Redmi 14C 4G - Snapdragon 4 Gen 2 - Adreno 619
PROP

          # ── META-INF ────────────────────────────────────
          echo "#MAGISK" > "$M/META-INF/com/google/android/updater-script"

          cat > "$M/META-INF/com/google/android/update-binary" << 'UB'
#!/sbin/sh
OUTFD=$2; ZIPFILE=$3
umask 022
mkdir -p /dev/tmp
ui_print() { echo "$1"; }
mount /data 2>/dev/null
if [ -f /data/adb/magisk/util_functions.sh ]; then
  . /data/adb/magisk/util_functions.sh; NVBASE=/data/adb
elif [ -f /data/adb/ksu/util_functions.sh ]; then
  . /data/adb/ksu/util_functions.sh; NVBASE=/data/adb
else
  ui_print "Install Magisk or KernelSU first!"; exit 1
fi
setup_flashable; mount_partitions; api_level_arch_detect
$BOOTMODE && boot_actions
SKIPUNZIP=1
. $TMPDIR/install.sh
print_modname; on_install
[ "$(grep_prop PROPFILE $TMPDIR/module.prop)" = "true" ] && cp -af $TMPDIR/system.prop $MODPATH/system.prop
[ "$(grep_prop LATESTARTSERVICE $TMPDIR/module.prop)" = "true" ] && cp -af $TMPDIR/service.sh $MODPATH/service.sh
set_permissions
UB

          # ── install.sh ──────────────────────────────────
          cat > "$M/install.sh" << 'IS'
SKIPMOUNT=false
PROPFILE=true
POSTFSDATA=false
LATESTARTSERVICE=true
REPLACE=""

print_modname() {
  ui_print " "
  ui_print "╔══════════════════════════════════════╗"
  ui_print "║  AKRO GameEquipment  -  Redmi 14C   ║"
  ui_print "║  Snapdragon 4 Gen 2  |  Adreno 619  ║"
  ui_print "╚══════════════════════════════════════╝"
  ui_print " "
  sleep 1
  ui_print "• Device  : $(getprop ro.build.product)"
  ui_print "• Model   : $(getprop ro.product.model)"
  ui_print "• Board   : $(getprop ro.product.board)"
  ui_print "• Android : $(getprop ro.build.version.release)"
  ui_print "• RAM     : $(free 2>/dev/null | grep Mem | awk '{print $2}') kB"
  ui_print " "
  DEVICE=$(getprop ro.product.device)
  case "$DEVICE" in
    earth|earthin|earthg|Redmi14C*)
      ui_print "[✓] Device verified: Redmi 14C" ;;
    *)
      ui_print "[!] WARNING: Device not verified ($DEVICE)"
      sleep 2 ;;
  esac
}

on_install() {
  ui_print "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  ui_print "  Flashing GPU / Thermal / Touch       "
  ui_print "  vendor/{bin,etc,lib,lib64}...        "
  ui_print "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  unzip -o "$ZIPFILE" 'system/*' -d "$MODPATH" >&2
  ui_print "[*] Clearing shader cache..."
  for i in $(find /data/user_de -name "*shaders_cache*" 2>/dev/null | grep code_cache); do
    rm -rf "$i" 2>/dev/null
  done
  for i in $(find /data -type f -name "*shader*" 2>/dev/null); do
    rm -f "$i" 2>/dev/null
  done
  ui_print "[✓] Done"
}

set_permissions() {
  set_perm_recursive "$MODPATH" 0 0 0755 0644
  set_perm_recursive "$MODPATH/system/vendor/bin" 0 2000 0755 0755
  ui_print " "
  ui_print "╔══════════════════════════════════════╗"
  ui_print "║   Complete! — Reboot to apply       ║"
  ui_print "╚══════════════════════════════════════╝"
}
IS

          # ── system.prop ─────────────────────────────────
          cat > "$M/system.prop" << 'SP'
# AKRO GameEquipment - Redmi 14C | SM6225 | Adreno 619
ro.vendor.dfps.enable=false
ro.vendor.smart_dfps.enable=false
debug.gr.swapinterval=0
ro.surface_flinger.max_frame_buffer_acquired_buffers=3
debug.egl.buffcount=4
debug.sf.recomputecrop=0
debug.sf.disable_backpressure=1
persist.vendor.thermal.enable=false
persist.vendor.thermal.config=thermal-normal
sys.thermal.data.source=0
touch.size.scale=1
touch.size.bias=0
touch.size.isSummed=0
touch.pressure.scale=0.001
touch.distance.calibration=none
touch.distance.scale=0
touch.coverage.calibration=box
touch.gestureMode=spots
MultitouchSettleInterval=1ms
MultitouchMinDistance=1px
TapInterval=1ms
TapSlop=1px
net.ipv4.tcp_fastopen=3
wifi.supplicant_scan_interval=180
net.tcp.buffersize.wifi=524288,1048576,2097152,524288,1048576,2097152
ro.config.low_ram=false
ro.lmk.critical_upgrade=true
ro.lmk.upgrade_pressure=40
ro.lmk.downgrade_pressure=60
ro.lmk.kill_heaviest_task=true
ro.vendor.qti.sys.fw.bg_apps_limit=60
ro.gfx.driver.1=com.qualcomm.qti.gpudrivers.sm6225.api30
debug.hwui.renderer=opengl
persist.graphics.vulkan.disable=false
persist.miui.extm.enable=1
debug.sf.enable_hwc_vds=1
SP

          # ── service.sh ──────────────────────────────────
          cat > "$M/service.sh" << 'SS'
#!/system/bin/sh
MODDIR=${0%/*}
until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
sleep 5

# CPU governor
for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
  echo "performance" > "$cpu" 2>/dev/null || echo "schedutil" > "$cpu" 2>/dev/null
done

# GPU Adreno 619
echo "performance" > /sys/class/kgsl/kgsl-3d0/devfreq/governor 2>/dev/null
echo 0 > /sys/class/kgsl/kgsl-3d0/bus_split 2>/dev/null
echo 1 > /sys/class/kgsl/kgsl-3d0/force_clk_on 2>/dev/null
echo 10000 > /sys/class/kgsl/kgsl-3d0/idle_timer 2>/dev/null

# I/O
for b in /sys/block/*/queue/scheduler; do
  echo "deadline" > "$b" 2>/dev/null || echo "cfq" > "$b" 2>/dev/null
done
for b in /sys/block/*/queue/read_ahead_kb; do echo "2048" > "$b" 2>/dev/null; done

# VM
echo 10 > /proc/sys/vm/swappiness
echo 0 > /proc/sys/vm/page-cluster
echo 3000 > /proc/sys/vm/dirty_expire_centisecs
echo 500 > /proc/sys/vm/dirty_writeback_centisecs

# Network
echo 3 > /proc/sys/net/ipv4/tcp_fastopen 2>/dev/null
echo 1 > /proc/sys/net/ipv4/tcp_low_latency 2>/dev/null
echo 0 > /proc/sys/net/ipv4/tcp_timestamps 2>/dev/null
SS
          chmod +x "$M/service.sh"

      - name: Inject extracted vendor files into module
        run: |
          M="module_build"

          echo "[*] Injecting vendor/bin..."
          find extracted/vendor_bin -type f 2>/dev/null | while read f; do
            rel=$(echo "$f" | sed 's|extracted/vendor_bin/||;s|.*vendor/bin/||')
            mkdir -p "$M/system/vendor/bin/$(dirname $rel)"
            cp -v "$f" "$M/system/vendor/bin/$rel"
          done

          echo "[*] Injecting vendor/etc..."
          find extracted/vendor_etc -type f 2>/dev/null | while read f; do
            rel=$(echo "$f" | sed 's|extracted/vendor_etc/||;s|.*vendor/etc/||')
            mkdir -p "$M/system/vendor/etc/$(dirname $rel)"
            cp -v "$f" "$M/system/vendor/etc/$rel"
          done

          echo "[*] Injecting vendor/lib..."
          find extracted/vendor_lib -type f 2>/dev/null | while read f; do
            if echo "$f" | grep -q "egl/"; then
              fname=$(basename "$f")
              cp -v "$f" "$M/system/vendor/lib/egl/$fname"
            elif echo "$f" | grep -q "hw/"; then
              fname=$(basename "$f")
              cp -v "$f" "$M/system/vendor/lib/hw/$fname"
            else
              fname=$(basename "$f")
              cp -v "$f" "$M/system/vendor/lib/$fname"
            fi
          done

          echo "[*] Injecting vendor/lib64..."
          find extracted/vendor_lib64 -type f 2>/dev/null | while read f; do
            if echo "$f" | grep -q "egl/"; then
              fname=$(basename "$f")
              cp -v "$f" "$M/system/vendor/lib64/egl/$fname"
            elif echo "$f" | grep -q "hw/"; then
              fname=$(basename "$f")
              cp -v "$f" "$M/system/vendor/lib64/hw/$fname"
            else
              fname=$(basename "$f")
              cp -v "$f" "$M/system/vendor/lib64/$fname"
            fi
          done

          echo ""
          echo "=== Final module structure ==="
          find "$M" -type f | sort
          echo "Total: $(find $M -type f | wc -l) files"

      - name: Package final ZIP
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.0' }}"
          ZIP="AKRO_GameEquipment_Redmi14C_${VERSION}.zip"
          cd module_build
          zip -r9 "../$ZIP" . --exclude "*.DS_Store"
          cd ..
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          ls -lh "$ZIP"
          echo "SHA256: $(sha256sum $ZIP | cut -d' ' -f1)"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKRO-GameEquipment-Redmi14C-${{ github.event.inputs.version || 'v1.0' }}
          path: "*.zip"
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # JOB 3  —  Upload to GoFile
  # ─────────────────────────────────────────────────────────
  upload-gofile:
    name: Upload to GoFile
    runs-on: ubuntu-latest
    needs: build-module

    steps:
      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: AKRO-GameEquipment-Redmi14C-${{ github.event.inputs.version || 'v1.0' }}
          path: dist/

      - name: Upload to GoFile
        run: |
          ZIP=$(find dist/ -name "*.zip" | head -1)
          echo "[*] Uploading: $ZIP"

          SERVER=$(curl -s "https://api.gofile.io/servers" | python3 -c "
import json,sys
d=json.load(sys.stdin)
s=d.get('data',{}).get('servers',[])
print(s[0]['name'] if s else 'store1')
")
          echo "[*] GoFile server: $SERVER"

          RESP=$(curl -s -F "file=@$ZIP" "https://$SERVER.gofile.io/uploadFile")
          echo "Response: $RESP"

          URL=$(echo "$RESP" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print(d['data']['downloadPage'] if d.get('status')=='ok' else 'FAILED')
")
          ID=$(echo "$RESP" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print(d['data'].get('fileId','N/A') if d.get('status')=='ok' else 'N/A')
")

          if [ "$URL" = "FAILED" ]; then
            echo "[!] Upload failed!"
            exit 1
          fi

          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✅  GOFILE UPLOAD SUCCESSFUL            ║"
          echo "║  Link : $URL"
          echo "║  ID   : $ID"
          echo "╚══════════════════════════════════════════╝"

          cat >> $GITHUB_STEP_SUMMARY << SUM
## ✅ AKRO GameEquipment - Redmi 14C

| | |
|--|--|
| Version | ${{ github.event.inputs.version || 'v1.0' }} |
| GoFile | $URL |
| File ID | $ID |
SUM
